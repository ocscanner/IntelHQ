<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{--bg:#060a0f;--bg2:#0b1117;--bg3:#0f1820;--card:#111d28;--border:rgba(0,180,255,.10);--border2:rgba(0,180,255,.22);--muted:#7a9aaa;--text:#eef4f8;--text2:#b8d0dc;--warn:#ffb700;--fm:'Share Tech Mono',monospace;--fu:'Barlow Condensed',sans-serif;--fh:'Rajdhani',sans-serif}
