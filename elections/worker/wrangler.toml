name = "oc-election-wire"
main = "src/index.js"
compatibility_date = "2026-05-30"
workers_dev = true
# Cloudflare "Previews" are turned off for this Worker (see README, "How it's deployed"). If they're
# turned back on, `wrangler preview -c wrangler.toml` needs this block. Previews get none of the settings
# below (no database, feed schedule or secrets), so they can't touch election-night data.
previews = {}

[observability]
enabled = true

# Every 5 minutes the Worker downloads whatever state files are due (each state about every 10 minutes).
# Every minute it checks Decision Desk HQ's Bluesky feed (and AP's, if X_BEARER_TOKEN is set) for race calls
# and adds them to the desk's call queue. These are 2 of the 5 scheduled triggers a free account allows.
[triggers]
crons = ["*/5 * * * *", "* * * * *"]

[vars]
ELECTION_DATE = "2026-11-03"
# Sites allowed to use desk (write) actions from a browser
ALLOWED_ORIGINS = "https://ocscanner.github.io,https://ocscanner.news"

# State feeds. States post test numbers in the weeks before an election, so nothing is downloaded or
# shown before RESULTS_START (2 p.m. Pacific on Nov 3, an hour before the first polls close).
RESULTS_START = "2026-11-03T22:00:00Z"
# Which states to download: "all", "off", or a list like "AZ,GA,NC"
STATE_FEEDS = "all"
# How often each state is refreshed, at most
MIN_REFRESH_MINUTES = "9"
# Downloads allowed per 5-minute run. Free plan: keep 45 (the limit is 50).
# Workers Paid ($5/mo): raise to 500 so every state refreshes every run.
SUBREQUEST_BUDGET = "45"

# County-by-county results for Senate and governor races (the county map). The county files are
# large (up to a few MB each), more than the free plan's 10 ms of computing time per run can read,
# so leave this "off" on the free plan. With Workers Paid: set "on" (and SUBREQUEST_BUDGET "500").
COUNTY_FEEDS = "off"
# Orange County Registrar results file: the election number to start looking from (Nov 2026 ≈ 24)
OC_ELECTION_FROM = "24"

# Set to "true" to serve rehearsal data by default (the board can always ask with ?sim=1)
SIMULATE = "false"
SIM_CYCLE_MINUTES = "90"
# AP: version and test mode (only used once AP_API_KEY is set as a secret)
AP_BASE = "https://api.ap.org/v3"
AP_TEST = "false"

# Secrets — set with:  npx wrangler secret put DESK_TOKEN   (and AP_API_KEY if you license AP;
# X_BEARER_TOKEN to add @AP_RaceCalls to the call queue through the X API)

[[d1_databases]]
binding = "DB"
database_name = "oc-election-wire"
database_id = "3be6f405-2bff-403d-9d19-d29e49a63862"
