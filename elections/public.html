<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Election Results — OC Scanner</title>
<meta name="description" content="Live House, Senate and governor results for the Nov. 3, 2026 midterms, from state election offices, updated about every 10 minutes.">
<script>try{if(localStorage.getItem('ocs-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Copy board.css, board.js and data/us-states.json to the public site alongside this page -->
<link rel="stylesheet" href="board.css">
<style>
  :root{--bg:#060a0f;--bg2:#0b1117;--bg3:#0f1820;--card:#111d28;--border:rgba(0,180,255,.10);--border2:rgba(0,180,255,.22);--muted:#7a9aaa;--text:#eef4f8;--text2:#b8d0dc;--warn:#ffb700;--fm:'Share Tech Mono',monospace;--fu:'Barlow Condensed',sans-serif;--fh:'Rajdhani',sans-serif}
  html[data-theme="light"]{--bg:#eef2f6;--bg2:#e3e9ef;--bg3:#d9e2ea;--card:#fff;--border:rgba(0,90,160,.16);--border2:rgba(0,90,160,.30);--muted:#5a7484;--text:#12222e;--text2:#33505f;--warn:#b57e00}
  body{margin:0;background:var(--bg);color:var(--text)}
  header{padding:18px 20px 8px;max-width:1500px;margin:0 auto}
  header h1{font-family:var(--fh);font-size:1.7rem;margin:0;letter-spacing:.02em}
  header p{font-family:var(--fu);color:var(--text2);margin:2px 0 0;font-size:1.05rem}
  main{padding:8px 20px 40px;max-width:1500px;margin:0 auto}
  @media (max-width:760px){main,header{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header>
  <h1>2026 midterm results</h1>
  <p>House, Senate and governor races nationwide. Unofficial until each state certifies.</p>
</header>
<main id="board"></main>
<script src="board.js"></script>
<script>ElectionBoard.mount(document.getElementById('board'), { shapesUrl: 'data/us-states.json', publicMode: true });</script>
</body>
</html>
