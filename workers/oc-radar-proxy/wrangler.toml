# oc-radar-proxy — source of truth for the live Worker (v10, Nov 10, 2026).
# Deploy: `npx wrangler deploy` from this folder (secrets are kept; values never live in the repo).

name = "oc-radar-proxy"
main = "src/index.js"
compatibility_date = "2026-05-30"
workers_dev = true

# AI digest schedule: 8am, 2pm, 9pm Pacific Standard Time (an hour later during daylight time).
[triggers]
crons = ["0 16 * * *", "0 22 * * *", "0 5 * * *"]

# Shared digest store, so every Worker instance serves the same digest.
[[kv_namespaces]]
binding = "DIGEST_KV"
id = "REPLACE_WITH_KV_ID"

# Secrets (set with `npx wrangler secret put NAME`):
#   ANTHROPIC_API_KEY   — required for the digest
#   SPACEDEVS_KEY       — optional, not set; raises Launch Library limits
